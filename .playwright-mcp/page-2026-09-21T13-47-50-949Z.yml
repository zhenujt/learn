          - text: I sent the report yesterday. 明确结束的过去时间用一般过去时。
          - button "播放：I sent the report yesterday." [ref=f1e9375] [cursor=pointer]
        - listitem [ref=f1e9380]:
          - text: I've sent the report. Please take a look. 现在完成时强调当前结果。
          - button "播放：I've sent the report. Please take a look." [ref=f1e9382] [cursor=pointer]
        - listitem [ref=f1e9387]:
          - text: Could you tell me when the meeting starts? 间接问句中是主语 + 谓语。
          - button "播放：Could you tell me when the meeting starts?" [ref=f1e9389] [cursor=pointer]
        - listitem [ref=f1e9394]:
          - text: You don't have to attend. 不必。You mustn't attend. 禁止。意思不能互换。
          - button "播放：You don't have to attend." [ref=f1e9396] [cursor=pointer]
          - button "播放：You mustn't attend." [ref=f1e9402] [cursor=pointer]
        - listitem [ref=f1e9407]:
          - text: If we get approval today, we'll start tomorrow. 真实未来条件通常用 if + 现在时。
          - button "播放：If we get approval today, we'll start tomorrow." [ref=f1e9409] [cursor=pointer]
          - button "播放：if +" [ref=f1e9415] [cursor=pointer]
        - listitem [ref=f1e9420]:
          - text: I've been waiting for feedback since Monday. 完成进行时说明持续，since 引出起点。
          - button "播放：I've been waiting for feedback since Monday." [ref=f1e9422] [cursor=pointer]
          - button "播放：since" [ref=f1e9428] [cursor=pointer]
        - listitem [ref=f1e9433]:
          - text: Please send it by Friday. I'll wait until Friday. by 是截止，until 是持续到。
          - button "播放：Please send it by Friday. I'll wait until Friday. by" [ref=f1e9435] [cursor=pointer]
          - button "播放：until" [ref=f1e9441] [cursor=pointer]
        - listitem [ref=f1e9446]:
          - text: I should have confirmed the requirements first. should have + 过去分词表达过去应做未做。
          - button "播放：I should have confirmed the requirements first. should have +" [ref=f1e9448] [cursor=pointer]
      - paragraph [ref=f1e9453]: 不必把这里列出的语法全部学完才开始开会。更有效的顺序是：用一个场景练出完整表达，再补上它依赖的语法，直到自己能在实际工作中准确说明事实、请求、条件和承诺。
