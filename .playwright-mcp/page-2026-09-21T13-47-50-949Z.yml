          - button "播放：tomorrow morning" [ref=f1e6596] [cursor=pointer]
        - listitem [ref=f1e6601]: 合上文档，完成 30 秒“进展 → 阻碍 → 请求”汇报。
        - listitem [ref=f1e6602]: 把陈述句变成否定句、问句，再换昨天／现在／已完成三种时间。
