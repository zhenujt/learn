        - link "Workplace Spoken English" [ref=f1e3283] [cursor=pointer]:
          - /url: /?doc=workplace-spoken-english.md
      - paragraph [ref=f1e3284]: 这份指南面向与同事、经理、客户和跨团队伙伴的日常工作交流，不讨论旅游、购物或生活闲聊。前半部分适用于多数办公室岗位，软件开发场景单独列出。目标不是背“高级词”，而是能说清楚：发生了什么、需要什么、谁来做、什么时候完成、下一步是什么。
      - paragraph [ref=f1e3285]: 这里的“常用”指实用的工作沟通表达，不是基于某个语料库的频率排名。英语地区、公司文化和关系亲疏都会影响语气；同一句话也会因重音、语速和上下文而变得温和或强硬。
      - heading "1. 先掌握沟通的基本结构" [level=2] [ref=f1e3286]
